<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger — Jesse McCormack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: black;
            color: white;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 80px;
        }

        .label {
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: cyan;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 60px);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            font-size: 13px;
            margin-bottom: 48px;
        }

        .container {
            width: 100%;
            max-width: 580px;
        }

        /* Drop zone */
        #dropzone {
            border: 2px dashed #333;
            border-radius: 4px;
            padding: 44px 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            margin-bottom: 24px;
            user-select: none;
        }

        #dropzone.dragover {
            border-color: cyan;
            background: rgba(0, 255, 255, 0.04);
        }

        #dropzone .icon { font-size: 36px; margin-bottom: 12px; }
        #dropzone .hint { font-size: 14px; color: #bbb; }
        #dropzone .subhint { font-size: 12px; color: #444; margin-top: 6px; }

        #file-input { display: none; }

        /* File list */
        #file-list-section { margin-bottom: 24px; display: none; }

        .list-label {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #444;
            margin-bottom: 10px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            margin-bottom: 6px;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
        }

        .file-num {
            font-size: 11px;
            color: cyan;
            min-width: 22px;
            text-align: center;
        }

        .file-name {
            flex: 1;
            font-size: 13px;
            color: #ddd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            font-size: 11px;
            color: #444;
            white-space: nowrap;
        }

        .move-btn, .remove-btn {
            background: none;
            border: none;
            font-family: monospace;
            cursor: pointer;
            font-size: 15px;
            padding: 2px 5px;
            line-height: 1;
            transition: color 0.15s;
        }

        .move-btn { color: #555; }
        .move-btn:disabled { color: #222; cursor: default; }
        .move-btn:not(:disabled):hover { color: white; }

        .remove-btn { color: #444; }
        .remove-btn:hover { color: cyan; }

        /* Actions */
        .actions { display: flex; gap: 12px; align-items: center; }

        #merge-btn {
            flex: 1;
            padding: 14px 24px;
            background: #111;
            color: #333;
            border: 1px solid #222;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: not-allowed;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        #merge-btn.ready {
            background: transparent;
            color: cyan;
            border-color: cyan;
            cursor: pointer;
        }

        #merge-btn.ready:hover {
            background: rgba(0, 255, 255, 0.08);
        }

        #merge-btn.merging {
            color: #555;
            border-color: #333;
            cursor: wait;
        }

        #clear-btn {
            padding: 14px 18px;
            background: transparent;
            color: #444;
            border: 1px solid #222;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            display: none;
            transition: color 0.15s, border-color 0.15s;
        }

        #clear-btn:hover { color: white; border-color: #555; }

        #status {
            font-size: 12px;
            margin-top: 14px;
            text-align: center;
            min-height: 18px;
            color: #444;
        }

        #status.success { color: cyan; }
        #status.error { color: #ff4444; }
    </style>
</head>
<body>

    <div class="label">▸ Utility Tool</div>
    <h1>PDF Merger</h1>
    <p class="subtitle">Drop your PDFs, reorder them, download the result. Everything runs in your browser.</p>

    <div class="container">

        <div id="dropzone">
            <div class="icon">📄</div>
            <div class="hint">Click or drag PDF files here</div>
            <div class="subhint">No files are uploaded — merging happens locally</div>
        </div>
        <input type="file" id="file-input" accept="application/pdf" multiple>

        <div id="file-list-section">
            <div class="list-label" id="list-label">Files — 0 PDFs</div>
            <div id="file-list"></div>
        </div>

        <div class="actions">
            <button id="merge-btn" disabled>Merge PDFs</button>
            <button id="clear-btn">Clear</button>
        </div>

        <div id="status"></div>

    </div>

    <script type="module">
        import { PDFDocument } from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js';

        const dropzone    = document.getElementById('dropzone');
        const fileInput   = document.getElementById('file-input');
        const fileList    = document.getElementById('file-list');
        const fileSection = document.getElementById('file-list-section');
        const listLabel   = document.getElementById('list-label');
        const mergeBtn    = document.getElementById('merge-btn');
        const clearBtn    = document.getElementById('clear-btn');
        const status      = document.getElementById('status');

        let files = [];

        // --- Drop zone ---
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => addFiles(e.target.files));

        let dragCounter = 0;
        dropzone.addEventListener('dragenter', e => { e.preventDefault(); dragCounter++; dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', e => { e.preventDefault(); dragCounter--; if (dragCounter === 0) dropzone.classList.remove('dragover'); });
        dropzone.addEventListener('dragover', e => e.preventDefault());
        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            dragCounter = 0;
            dropzone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });

        function addFiles(newFiles) {
            const existing = new Set(files.map(f => f.name + f.size));
            const pdfs = Array.from(newFiles).filter(f => f.type === 'application/pdf' && !existing.has(f.name + f.size));
            files = [...files, ...pdfs];
            setStatus('');
            render();
        }

        function removeFile(idx) {
            files.splice(idx, 1);
            setStatus('');
            render();
        }

        function moveFile(from, to) {
            const [item] = files.splice(from, 1);
            files.splice(to, 0, item);
            render();
        }

        function render() {
            fileList.innerHTML = '';

            if (files.length === 0) {
                fileSection.style.display = 'none';
                clearBtn.style.display = 'none';
                mergeBtn.disabled = true;
                mergeBtn.className = '';
                mergeBtn.textContent = 'Merge PDFs';
                return;
            }

            fileSection.style.display = 'block';
            clearBtn.style.display = 'block';
            listLabel.textContent = `Files — ${files.length} PDF${files.length !== 1 ? 's' : ''}`;

            files.forEach((file, idx) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="file-num">${String(idx + 1).padStart(2, '0')}</span>
                    <span class="file-name" title="${file.name}">${file.name}</span>
                    <span class="file-size">${(file.size / 1024).toFixed(0)} KB</span>
                    <button class="move-btn up" ${idx === 0 ? 'disabled' : ''}>↑</button>
                    <button class="move-btn down" ${idx === files.length - 1 ? 'disabled' : ''}>↓</button>
                    <button class="remove-btn">×</button>
                `;
                item.querySelector('.up').addEventListener('click', () => { if (idx > 0) moveFile(idx, idx - 1); });
                item.querySelector('.down').addEventListener('click', () => { if (idx < files.length - 1) moveFile(idx, idx + 1); });
                item.querySelector('.remove-btn').addEventListener('click', () => removeFile(idx));
                fileList.appendChild(item);
            });

            if (files.length >= 2) {
                mergeBtn.disabled = false;
                mergeBtn.className = 'ready';
                mergeBtn.textContent = `Merge ${files.length} PDFs`;
            } else {
                mergeBtn.disabled = true;
                mergeBtn.className = '';
                mergeBtn.textContent = 'Add one more PDF to merge';
            }
        }

        clearBtn.addEventListener('click', () => {
            files = [];
            fileInput.value = '';
            setStatus('');
            render();
        });

        mergeBtn.addEventListener('click', async () => {
            if (files.length < 2 || mergeBtn.classList.contains('merging')) return;

            mergeBtn.className = 'merging';
            mergeBtn.textContent = 'Merging…';
            setStatus('');

            try {
                const merged = await PDFDocument.create();

                for (const file of files) {
                    const bytes = await file.arrayBuffer();
                    const doc = await PDFDocument.load(bytes);
                    const pages = await merged.copyPages(doc, doc.getPageIndices());
                    pages.forEach(p => merged.addPage(p));
                }

                const mergedBytes = await merged.save();
                const blob = new Blob([mergedBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged.pdf';
                a.click();
                URL.revokeObjectURL(url);

                mergeBtn.className = 'ready';
                mergeBtn.textContent = `Merge ${files.length} PDFs`;
                setStatus('✓ merged.pdf saved to your downloads folder', 'success');

            } catch (err) {
                mergeBtn.className = 'ready';
                mergeBtn.textContent = `Merge ${files.length} PDFs`;
                setStatus('Error: ' + err.message, 'error');
            }
        });

        function setStatus(msg, type = '') {
            status.textContent = msg;
            status.className = type;
        }

        render();
    </script>

</body>
</html>
